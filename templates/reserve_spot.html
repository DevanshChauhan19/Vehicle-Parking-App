{% extends "base.html" %}
{% block content %}
<h2>Reserve Spot in {{ lot.name }}</h2>

<form method="POST">
    <div class="mb-3">
        <label>Select Available Spot:</label>
        <select name="spot_id" class="form-select" required>
            {% for spot in spots %}
                <option value="{{ spot.id }}">Spot {{ spot.id }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-success">Reserve Spot</button>
    <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
